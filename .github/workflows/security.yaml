name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 5 * * *" # daily, after the 04:00 UTC sync from Gitee
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-cve:
    name: Dependency CVE audit (pnpm + OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit gate (fails on high/critical, allowlist security-allowlist.json)
        run: pnpm audit:check

  osv-deep-scan:
    name: OSV deep scan (cross-check lockfile against OSV database)
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  codeql-sast:
    name: CodeQL SAST (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
